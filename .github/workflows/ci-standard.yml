name: CI Standard
on:
  push:
    branches: [main]
    paths-ignore:
      - "LICENSE"
      - ".gitignore"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pick-runner:
    runs-on: ${{ !github.event.repository.private && vars.CI_RUNNER_MODE != 'local' && 'ubuntu-latest' || 'd-sorg-fleet' }}
    timeout-minutes: 1
    outputs:
      runner: ${{ steps.check.outputs.runner }}
      mode: ${{ steps.check.outputs.mode }}
    steps:
      - name: Select runner target
        id: check
        env:
          CI_RUNNER_MODE: ${{ vars.CI_RUNNER_MODE }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
          LOCAL_RUNNER: d-sorg-fleet
        shell: bash
        run: |
          if [ "$REPOSITORY_PRIVATE" != "true" ] && [ "${CI_RUNNER_MODE:-auto}" != "local" ]; then
            runner=ubuntu-latest
            mode=hosted
          else
            runner="$LOCAL_RUNNER"
            mode=local
          fi
          echo "runner=$runner" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Selected $runner ($mode)"

  quality-gate:
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Prepare Python tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade --ignore-installed setuptools wheel
      - run: python -m pip install ruff==0.14.10 mypy==1.13.0 bandit==1.7.7
      - name: Lint
        run: python -m ruff check src scripts tests

      - name: Check Formatting (ruff)
        run: python -m ruff format --check src scripts tests

      - run: python -m pip install mypy types-PyYAML types-requests
      - run: python -m pip install -e .[dev]
      - run: python -m mypy src --config-file pyproject.toml

      - name: Verify No Placeholders
        run: |
          violations=$(
            find . \( -path "./.git" -o -path "./.mypy_cache" -o -path "./.ruff_cache" -o -path "./__pycache__" -o -path "./scripts" \) -prune -o -type f -name "*.py" -print0 \
              | xargs -0 grep -nE "TODO|FIXME" || true
          )
          if [ -n "$violations" ]; then
            echo "$violations"
            echo "::error::Placeholders found. Remove TODOs/FIXMEs or create tracked GitHub issues."
            exit 1
          fi

      - name: Security Audit
        timeout-minutes: 20
        run: |
          rm -rf .audit-venv
          python -m venv .audit-venv
          AUDIT_PYTHON="$PWD/.audit-venv/bin/python"
          "$AUDIT_PYTHON" -m pip install --upgrade pip setuptools wheel
          "$AUDIT_PYTHON" -m pip install -e .[dev]
          "$AUDIT_PYTHON" -m pip install pip-audit
          "$AUDIT_PYTHON" -m pip install --upgrade pygments
          # CVE exceptions with expiration dates.
          # Each entry must have: (1) CVE ID, (2) reason, (3) expiration, (4) tracking issue.
          # See .github/cve-exceptions.md for full details.
          # - CVE-2026-4539: pygments upstream fix pending (expires 2026-05-31, #173-1)
          # - CVE-2026-32274: transitive dev-dependency, not exploitable in prod (expires 2026-05-31, #173-2)
          # - CVE-2026-21883: dev-only dependency (expires 2026-05-31, #173-3)
          # - CVE-2026-27205: waiting for upstream release (expires 2026-06-15, #173-4)
          # - CVE-2024-47081: dev-only, no runtime impact (expires 2026-05-31, #173-5)
          # - CVE-2026-3219: upstream fix in progress (expires 2026-06-15, #173-6)
          # - CVE-2026-25645: transitive dependency, monitor for patch (expires 2026-06-15, #173-7)
          # - PYSEC-2026-196: pip issue, awaiting pip upgrade in audit environment (expires 2026-07-31)
          # - PYSEC-2026-2876: pip issue, awaiting pip upgrade in audit environment (expires 2026-07-31)
          "$PWD/.audit-venv/bin/pip-audit" --skip-editable \
            --ignore-vuln CVE-2026-4539 \
            --ignore-vuln CVE-2026-32274 \
            --ignore-vuln CVE-2026-21883 \
            --ignore-vuln CVE-2026-27205 \
            --ignore-vuln CVE-2024-47081 \
            --ignore-vuln CVE-2026-3219 \
            --ignore-vuln CVE-2026-25645 \
            --ignore-vuln PYSEC-2026-196 \
            --ignore-vuln PYSEC-2026-2876

      - name: Bandit Security Scan
        run: |
          python -m bandit -r src/ -ll -ii --format txt

      - name: Generate SBOM
        run: |
          rm -rf .sbom-venv
          python -m venv .sbom-venv
          SBOM_PYTHON="$PWD/.sbom-venv/bin/python"
          "$SBOM_PYTHON" -m pip install --upgrade pip setuptools wheel
          "$SBOM_PYTHON" -m pip install -e .[dev]
          for i in 1 2 3 4 5; do "$SBOM_PYTHON" -m pip install --no-cache-dir cyclonedx-bom && break || sleep 5; done
          for i in 1 2 3 4 5; do "$PWD/.sbom-venv/bin/cyclonedx-py" environment "$SBOM_PYTHON" --pyproject pyproject.toml -o sbom.json --output-format JSON && break || sleep 5; done

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.json

    needs: pick-runner
  rust:
    needs:
      - pick-runner
    runs-on: [self-hosted, Linux, X64, d-sorg-fleet]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust_core
          prefix-key: v2-rust
      - name: Run Rust tests
        run: |
          cd rust_core
          cargo test --verbose
      - name: Build Rust extension
        run: |
          cd rust_core
          cargo build --verbose --release
      - name: Upload Rust artifact
        uses: actions/upload-artifact@v7
        with:
          name: rust-core-${{ github.sha }}
          path: rust_core/target/release/libmujoco_models_core.so
          if-no-files-found: warn

  tests:
    name: tests (${{ matrix.python }})
    needs:
      - pick-runner
      - rust
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Prepare Python tooling
        run: |
          python -m venv .test-venv
          echo "$PWD/.test-venv/bin" >> "$GITHUB_PATH"
          .test-venv/bin/python -m pip install --upgrade pip
          .test-venv/bin/python -m pip install --upgrade --ignore-installed setuptools wheel

      - name: Install Dependencies
        run: python -m pip install -e .[dev]

      - name: Verify package is importable without PYTHONPATH
        run: python -c "import mujoco_models"

      - name: Verify model_pack entry-point surface (issue #45)
        run: |
          python -c "from mujoco_models.model_pack import resolve, manifest, list_exercises; resolve(); manifest(); list_exercises()"

      - name: Run Test Suite
        env:
          PYTHONUNBUFFERED: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          python - <<'PY'
          from pathlib import Path
          import mujoco_models

          package_path = Path(mujoco_models.__file__).resolve()
          source_root = (Path.cwd() / "src" / "mujoco_models").resolve()
          if source_root not in package_path.parents:
              raise SystemExit(
                  f"mujoco_models imported from {package_path}, expected under {source_root}"
              )
          PY
          python -u -m pytest \
            -p pytest_cov \
            -p pytest_timeout \
            -p pytest_benchmark.plugin \
            -p no:xvfb \
            --timeout=60 \
            --timeout-method=signal \
            -m "not slow and not requires_mujoco and not benchmark" \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-config=pyproject.toml \
            --cov-fail-under=80 \
            --tb=short \
            -v

      - name: Run Benchmarks
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          python -m pytest \
            -p pytest_timeout \
            -p pytest_benchmark.plugin \
            -p no:xvfb \
            -o addopts="-ra -q --strict-markers --strict-config --durations=20" \
            -m "benchmark" \
            --timeout=120 \
            --timeout-method=thread \
            --benchmark-only \
            --benchmark-json=benchmark-results.json \
            --tb=short \
            -v

      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results-py${{ matrix.python }}
          path: benchmark-results.json
