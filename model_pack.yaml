schema: model_pack/v1
repo: MuJoCo_Models
package: mujoco_models
engine: mujoco
engine_version: ">=3.0,<4"
anthropometrics: winter_2009
format: mjcf
models_root: src/mujoco_models/exercises
exercises:
  - id: squat
    path: src/mujoco_models/exercises/squat
  - id: deadlift
    path: src/mujoco_models/exercises/deadlift
  - id: bench_press
    path: src/mujoco_models/exercises/bench_press
  - id: snatch
    path: src/mujoco_models/exercises/snatch
  - id: clean_and_jerk
    path: src/mujoco_models/exercises/clean_and_jerk
  - id: gait
    path: src/mujoco_models/exercises/gait
  - id: sit_to_stand
    path: src/mujoco_models/exercises/sit_to_stand
capabilities:
  load_in_engine: {level: full, evidence: tests/parity/test_engine_conformance.py}
  forward_kinematics: {level: partial, evidence: null}  # engine-native only, no repo API
  inverse_kinematics: {level: partial, evidence: src/mujoco_models/optimization/inverse_kinematics.py}  # phase interpolation, no solver
  forward_dynamics: {level: partial, evidence: tests/parity/test_engine_physics.py}  # engine steps the model; no controller API
  inverse_dynamics: {level: none, evidence: null}
  contact_grf: {level: partial, evidence: src/mujoco_models/shared/parity/standing.py}  # fingerprint-only standing GRF
  urdf_import: {level: none, evidence: null}
  urdf_export: {level: none, evidence: null}
  video_export: {level: none, evidence: null}
