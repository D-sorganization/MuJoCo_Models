# SPDX-License-Identifier: MIT
schema_version: "2.0"
package:
  name: mujoco_models
  version: "0.1.0"
  description: "MuJoCo MJCF human biomechanical models and exercise suites"
exercises:
  - id: squat
    path: src/mujoco_models/exercises/squat
  - id: deadlift
    path: src/mujoco_models/exercises/deadlift
  - id: bench_press
    path: src/mujoco_models/exercises/bench_press
  - id: snatch
    path: src/mujoco_models/exercises/snatch
  - id: clean_and_jerk
    path: src/mujoco_models/exercises/clean_and_jerk
  - id: gait
    path: src/mujoco_models/exercises/gait
  - id: sit_to_stand
    path: src/mujoco_models/exercises/sit_to_stand
capabilities:
  load_in_engine:
    { level: full, evidence: tests/parity/test_engine_conformance.py }
  forward_kinematics: { level: partial, evidence: null } # engine-native only, no repo API
  inverse_kinematics:
    { level: full, evidence: tests/unit/optimization/test_task_target_ik.py }
  forward_dynamics: {
      level: partial,
      evidence: tests/parity/test_engine_physics.py,
    } # engine steps the model; no controller API
  inverse_dynamics:
    { level: full, evidence: tests/parity/test_engine_physics.py }
  contact_grf: { level: full, evidence: src/mujoco_models/grf.py }
  urdf_import: { level: full, evidence: tests/parity/test_pinocchio_urdf.py }
  urdf_export: { level: none, evidence: null }
  video_export: { level: full, evidence: src/mujoco_models/video.py }
